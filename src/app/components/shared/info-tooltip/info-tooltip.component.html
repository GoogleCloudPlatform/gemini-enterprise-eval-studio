<div #trigger class="relative inline-flex items-center group" (mouseenter)="onMouseEnter()" (mouseleave)="onMouseLeave()">
  <svg *ngIf="icon === 'info'" class="w-4 h-4 text-gray-400 hover:text-gray-600 cursor-help" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" role="img" aria-label="Help">
    <circle cx="12" cy="12" r="10"></circle>
    <line x1="12" y1="16" x2="12" y2="12"></line>
    <line x1="12" y1="8" x2="12.01" y2="8"></line>
  </svg>
  <svg *ngIf="icon === 'question'" class="w-4 h-4 text-gray-400 hover:text-gray-600 cursor-help" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Help">
    <circle cx="12" cy="12" r="10"></circle>
    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
    <line x1="12" y1="17" x2="12.01" y2="17"></line>
  </svg>
  <div *ngIf="align === 'left'" class="absolute bottom-0 left-0 flex flex-col items-start hidden mb-6 group-hover:flex w-max max-w-xs">
    <span class="relative z-10 p-2 text-xs text-white bg-gray-800 shadow-lg rounded-md normal-case font-normal tracking-normal">{{text}}</span>
    <div class="w-3 h-3 -mt-2 rotate-45 bg-gray-800 ml-1"></div>
  </div>
  <div *ngIf="align === 'right'" [ngStyle]="tooltipStyle" class="fixed z-50 flex flex-col items-end hidden group-hover:flex w-max max-w-xs">
    <span class="relative z-10 p-2 text-xs text-white bg-gray-800 shadow-lg rounded-md normal-case font-normal tracking-normal">{{text}}</span>
    <div class="w-3 h-3 -mt-2 rotate-45 bg-gray-800 mr-0.5"></div>
  </div>
</div>
